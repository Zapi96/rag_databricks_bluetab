# Databricks Asset Bundle Configuration
# This file defines the bundle structure for the RAG pipeline

bundle:
  name: rag_databricks_bluetab
  
variables:
  # Environment-specific variables
  catalog_name:
    description: "Catalog name for the RAG pipeline"
    default: "bluetab"
    
  schema_name:
    description: "Schema name for the RAG pipeline"
    default: "rag"
    
  environment:
    description: "Deployment environment"
    default: "dev"
    
  # Model configuration
  embedding_model_base:
    description: "Base embedding model from Hugging Face"
    default: "distilbert-base-uncased"
    
  llm_base_model:
    description: "Base LLM model from Hugging Face"
    default: "google/flan-t5-base"
    
  # Processing parameters
  chunk_size:
    description: "Text chunk size for processing"
    default: 1000
    
  chunk_overlap:
    description: "Text chunk overlap"
    default: 200
    
  batch_size:
    description: "Processing batch size"
    default: 32
    
  # Endpoint configuration
  workload_size:
    description: "Serving endpoint workload size"
    default: "Small"

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-ad7d5e59-0280.cloud.databricks.com//
    variables:
      environment: "dev"
      catalog_name: "bluetab"
      schema_name: "rag"
      
  test:
    workspace:
      host: https://dbc-ad7d5e59-0280.cloud.databricks.com/
    variables:
      environment: "test"
      catalog_name: "bluetab"
      schema_name: "rag_test"
      workload_size: "Medium"
      
  prod:
    workspace:
      host: https://dbc-ad7d5e59-0280.cloud.databricks.com/
    variables:
      environment: "prod"
      catalog_name: "bluetab"
      schema_name: "rag_prod"
      workload_size: "Large"
      chunk_size: 1500
      batch_size: 64

resources:
  jobs:
    rag_pipeline_job:
      name: "RAG Pipeline - ${var.environment}"

      tasks:
        - task_key: "setup_configuration"
          notebook_task:
            notebook_path: "RAG Chatbot/00 Configuration and Utils.ipynb"
            base_parameters:
              catalog_name: "${var.catalog_name}"
              schema_name: "${var.schema_name}"
              environment: "${var.environment}"
              chunk_size: "${var.chunk_size}"
              chunk_overlap: "${var.chunk_overlap}"
              batch_size: "${var.batch_size}"
              
        - task_key: "create_tables"
          depends_on:
            - task_key: "setup_configuration"
          
          notebook_task:
            notebook_path: "RAG Chatbot/01 Create needed tables.ipynb"
            base_parameters:
              catalog_name: "${var.catalog_name}"
              schema_name: "${var.schema_name}"
              environment: "${var.environment}"
              
        - task_key: "process_pdfs"
          depends_on:
            - task_key: "create_tables"
          
          notebook_task:
            notebook_path: "RAG Chatbot/02 Incremental PDF to docs_text.ipynb"
            base_parameters:
              catalog_name: "${var.catalog_name}"
              schema_name: "${var.schema_name}"
              environment: "${var.environment}"
              chunk_size: "${var.chunk_size}"
              chunk_overlap: "${var.chunk_overlap}"
              
        - task_key: "register_embedding_model"
          depends_on:
            - task_key: "process_pdfs"
          
          notebook_task:
            notebook_path: "RAG Chatbot/03 Register embedding model.ipynb"
            base_parameters:
              catalog_name: "${var.catalog_name}"
              schema_name: "${var.schema_name}"
              environment: "${var.environment}"
              embedding_model_base: "${var.embedding_model_base}"
              
        - task_key: "create_embedding_endpoint"
          depends_on:
            - task_key: "register_embedding_model"
          
          notebook_task:
            notebook_path: "RAG Chatbot/04 Create Embbeding Serving Endpoint.ipynb"
            base_parameters:
              catalog_name: "${var.catalog_name}"
              schema_name: "${var.schema_name}"
              environment: "${var.environment}"
              workload_size: "${var.workload_size}"
              
        - task_key: "register_llm_model"
          depends_on:
            - task_key: "create_embedding_endpoint"
          
          notebook_task:
            notebook_path: "RAG Chatbot/05 Register LLM model.ipynb"
            base_parameters:
              catalog_name: "${var.catalog_name}"
              schema_name: "${var.schema_name}"
              environment: "${var.environment}"
              llm_base_model: "${var.llm_base_model}"
              
        - task_key: "create_llm_endpoint"
          depends_on:
            - task_key: "register_llm_model"
          
          notebook_task:
            notebook_path: "RAG Chatbot/06 Create LLM Serving Endpoint.ipynb"
            base_parameters:
              catalog_name: "${var.catalog_name}"
              schema_name: "${var.schema_name}"
              environment: "${var.environment}"
              workload_size: "${var.workload_size}"
              
        - task_key: "create_embeddings"
          depends_on:
            - task_key: "create_embedding_endpoint"
          
          notebook_task:
            notebook_path: "RAG Chatbot/07 Crear Embbedings.ipynb"
            base_parameters:
              catalog_name: "${var.catalog_name}"
              schema_name: "${var.schema_name}"
              environment: "${var.environment}"
              batch_size: "${var.batch_size}"
              
        - task_key: "create_vector_index"
          depends_on:
            - task_key: "create_embeddings"
          
          notebook_task:
            notebook_path: "RAG Chatbot/08 Create index.ipynb"
            base_parameters:
              catalog_name: "${var.catalog_name}"
              schema_name: "${var.schema_name}"
              environment: "${var.environment}"
              
        - task_key: "register_rag_model"
          depends_on:
            - task_key: "create_vector_index"
            - task_key: "create_llm_endpoint"
          
          notebook_task:
            notebook_path: "RAG Chatbot/09 Chatbot.ipynb"
            base_parameters:
              catalog_name: "${var.catalog_name}"
              schema_name: "${var.schema_name}"
              environment: "${var.environment}"
              
        - task_key: "create_rag_endpoint"
          depends_on:
            - task_key: "register_rag_model"
          
          notebook_task:
            notebook_path: "RAG Chatbot/10 Create RAG Serving Endpoint.ipynb"
            base_parameters:
              catalog_name: "${var.catalog_name}"
              schema_name: "${var.schema_name}"
              environment: "${var.environment}"
              workload_size: "${var.workload_size}"

      timeout_seconds: 3600
      max_concurrent_runs: 1
      
