# Development Environment Configuration
# This file contains development-specific settings for the RAG pipeline

variables:
  environment: "dev"
  catalog_name: "bluetab"
  schema_name: "rag"
  
  # Development-specific model settings
  embedding_model_base: "distilbert-base-uncased"
  llm_base_model: "google/flan-t5-small"  # Smaller model for dev
  
  # Development processing settings
  chunk_size: 500  # Smaller chunks for faster processing
  chunk_overlap: 100
  batch_size: 16   # Smaller batches for dev
  
  # Development endpoint settings
  workload_size: "Small"
  scale_to_zero: "true"
  
  # Volume paths for development
  pdf_volume_path: "/Volumes/bluetab/rag/pdf_vol"
  
  # MLflow settings
  experiment_name: "/Shared/RAG_Databricks_Bluetab_Pipeline_Dev"

workspace:
  host: https://dbc-ad7d5e59-0280.cloud.databricks.com/
  
# Development-specific job configuration
resources:
  jobs:
    rag_dev_job:
      name: "RAG Pipeline - Development"
      job_clusters:
        - job_cluster_key: "dev_cluster"
          serverless:
            catalog: "bluetab"
            schema: "rag"
